services:
  postgres:
    image: postgres:16-alpine
    container_name: chesstoire-db
    environment:
      POSTGRES_USER: chesstoire
      POSTGRES_PASSWORD: chesstoire_dev
      POSTGRES_DB: chesstoire
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chesstoire"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chesstoire-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
